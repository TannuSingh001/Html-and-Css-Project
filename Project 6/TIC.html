<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="TIC.css" class="css">
    <title>Tic Tac Toe</title>
</head>
<body>
<div class="window">

    <div class="title-bar">
        <div class="dots">
            <span class="red"></span>
            <span class="yellow"></span>
            <span class="green"></span>
        </div>
        <h2>Tic Tac Toe</h2>
    </div>

    <p class="turn">Player X's Turn</p>

    <div class="board">
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>

        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>

        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
    </div>

    <button class="reset">New Game</button>

</div>

    <script src="TIC.js"></script>
    </body>
    </html>
