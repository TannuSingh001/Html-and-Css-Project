<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game">

        <div class="hand">
            <div class="you-div">👊</div>
            <div class="computer-div">👊</div>
        </div>

        <div class="choices">
            <div class="choice" id="stone">👊</div>
            <div class="choice" id="paper">✋</div>
            <div class="choice" id="scissor">✌️</div>
        </div>

    </div>
    <h2 id="result">Choose One</h2>

<p>
    You: <span id="userScore">0</span>
    &nbsp;&nbsp;
    Computer: <span id="compScore">0</span>
</p>

<button id="reset">Reset</button>

    <script src="script.js"></script>
</body>
</html>
