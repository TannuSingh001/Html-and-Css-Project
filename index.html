<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Mahadev - The Divine Energy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated Background -->
    <div class="background"></div>

    <div class="stars"></div>

    <!-- Main Container -->
    <div class="container">

        <h1>🔱 MAHADEV 🔱</h1>

        <p class="subtitle">
            हर हर महादेव
        </p>


        <!-- Shiva Illustration -->
        <div class="shiva">

            <!-- Hair -->
            <div class="hair"></div>

            <!-- Face -->
            <div class="face">

                <!-- Eyes -->
                <div class="eye left"></div>
                <div class="eye right"></div>

                <!-- Third Eye -->
                <div class="third-eye">
                    🔥
                </div>

                <!-- Nose -->
                <div class="nose"></div>

                <!-- Tilak -->
                <div class="tilak"></div>

                <!-- Lips -->
                <div class="lips"></div>

            </div>


            <!-- Moon -->
            <div class="moon">
                ☾
            </div>


            <!-- Ganga -->
            <div class="ganga">
                💧
            </div>


            <!-- Snake -->
            <div class="snake"></div>

            <div class="snake-head">
                🐍
            </div>


            <!-- Trishul -->
            <div class="trishul">

                <div class="trishul-top">
                    🔱
                </div>

            </div>

        </div>


        <!-- Om -->
        <div class="om">
            ॐ
        </div>


        <!-- Mantra -->
        <div class="mantra">
            ॐ नमः शिवाय
        </div>


        <!-- Buttons -->
        <div class="buttons">

            <button id="speakBtn">
                🔊 सुनें
            </button>

            <button id="mantraBtn">
                🕉️ मंत्र
            </button>

        </div>


        <!-- Speaking Text -->
        <div id="message">
            हर हर महादेव
        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
