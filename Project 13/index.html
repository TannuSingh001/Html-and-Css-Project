<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
        }

        .game {
            width: 90%;
            max-width: 520px;
            padding: 35px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        /* HEADER */

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 30px;
            color: #111827;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
            font-size: 15px;
        }

        /* SCORE */

        .score-board {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 18px;
            margin-bottom: 25px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
        }

        .score-box h3 {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .score {
            font-size: 28px;
            font-weight: bold;
        }

        #player-score {
            color: #2563eb;
        }

        #computer-score {
            color: #dc2626;
        }

        .vs {
            font-weight: bold;
            color: #9ca3af;
        }

        /* RESULT */

        .result {
            padding: 20px;
            margin-bottom: 25px;
            background: #f9fafb;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        .choices-result {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
        }

        .result-box span {
            display: block;
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .result-box strong {
            font-size: 18px;
            color: #111827;
        }

        #winner {
            font-size: 20px;
            font-weight: bold;
            color: #2563eb;
        }

        /* CHOICES */

        .choose-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #374151;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .choice {
            flex: 1;
            padding: 16px 10px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: white;
            color: #374151;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }

        .choice:hover {
            background: #f3f4f6;
            border-color: #2563eb;
            transform: translateY(-2px);
        }

        .choice span {
            display: block;
            font-size: 30px;
            margin-bottom: 7px;
        }

        /* RESET */

        .reset {
            margin-top: 25px;
        }

        #reset-button {
            padding: 11px 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        #reset-button:hover {
            background: #1d4ed8;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .game {
                padding: 25px 18px;
            }

            .header h1 {
                font-size: 25px;
            }

            .choices {
                flex-direction: column;
            }

            .choice {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="game">

        <!-- HEADER -->

        <div class="header">
            <h1>Rock Paper Scissors</h1>
            <p>Choose your move and play against the computer.</p>
        </div>


        <!-- SCORE -->

        <div class="score-board">

            <div class="score-box">
                <h3>YOU</h3>
                <div id="player-score" class="score">0</div>
            </div>

            <div class="vs">VS</div>

            <div class="score-box">
                <h3>COMPUTER</h3>
                <div id="computer-score" class="score">0</div>
            </div>

        </div>


        <!-- RESULT -->

        <div class="result">

            <div class="choices-result">

                <div class="result-box">
                    <span>Your Choice</span>
                    <strong id="player-choice">-</strong>
                </div>

                <div class="result-box">
                    <span>Computer Choice</span>
                    <strong id="computer-choice">-</strong>
                </div>

            </div>

            <div id="winner">
                Choose an option to start
            </div>

        </div>


        <!-- CHOICES -->

        <div class="choose-title">
            Choose your move
        </div>

        <div class="choices">

            <button class="choice" data-choice="Rock">
                <span>🪨</span>
                Rock
            </button>

            <button class="choice" data-choice="Paper">
                <span>📄</span>
                Paper
            </button>

            <button class="choice" data-choice="Scissors">
                <span>✂️</span>
                Scissors
            </button>

        </div>


        <!-- RESET -->

        <div class="reset">

            <button id="reset-button">
                Reset Game
            </button>

        </div>

    </div>


    <script>

        const choiceButtons =
            document.querySelectorAll(".choice");

        const playerChoiceText =
            document.getElementById("player-choice");

        const computerChoiceText =
            document.getElementById("computer-choice");

        const winnerText =
            document.getElementById("winner");

        const playerScoreText =
            document.getElementById("player-score");

        const computerScoreText =
            document.getElementById("computer-score");

        const resetButton =
            document.getElementById("reset-button");


        let playerScore = 0;
        let computerScore = 0;


        const choices = [
            "Rock",
            "Paper",
            "Scissors"
        ];


        choiceButtons.forEach(function(button) {

            button.addEventListener("click", function() {

                const playerChoice =
                    button.dataset.choice;

                playGame(playerChoice);

            });

        });


        function getComputerChoice() {

            const randomIndex =
                Math.floor(
                    Math.random() * choices.length
                );

            return choices[randomIndex];
        }


        function findWinner(player, computer) {

            if (player === computer) {
                return "draw";
            }

            if (
                (player === "Rock" &&
                 computer === "Scissors") ||

                (player === "Paper" &&
                 computer === "Rock") ||

                (player === "Scissors" &&
                 computer === "Paper")
            ) {
                return "player";
            }

            return "computer";
        }


        function playGame(playerChoice) {

            const computerChoice =
                getComputerChoice();

            const result =
                findWinner(
                    playerChoice,
                    computerChoice
                );


            playerChoiceText.textContent =
                playerChoice;

            computerChoiceText.textContent =
                computerChoice;


            if (result === "player") {

                playerScore++;

                playerScoreText.textContent =
                    playerScore;

                winnerText.textContent =
                    "You Win!";

                winnerText.style.color =
                    "#16a34a";

            }

            else if (result === "computer") {

                computerScore++;

                computerScoreText.textContent =
                    computerScore;

                winnerText.textContent =
                    "Computer Wins!";

                winnerText.style.color =
                    "#dc2626";

            }

            else {

                winnerText.textContent =
                    "It's a Draw!";

                winnerText.style.color =
                    "#d97706";
            }
        }


        resetButton.addEventListener(
            "click",
            function() {

                playerScore = 0;
                computerScore = 0;

                playerScoreText.textContent = "0";
                computerScoreText.textContent = "0";

                playerChoiceText.textContent = "-";
                computerChoiceText.textContent = "-";

                winnerText.textContent =
                    "Choose an option to start";

                winnerText.style.color =
                    "#2563eb";
            }
        );

    </script>

</body>
</html>
